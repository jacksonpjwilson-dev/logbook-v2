name: Native iOS

on:
  push:
    branches: [native-ios-development]
    paths:
      - 'native-ios/**'
      - '.github/workflows/native-ios.yml'
  pull_request:
    paths:
      - 'native-ios/**'
      - '.github/workflows/native-ios.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: ./native-ios/generate-project.sh
      - name: Build iOS app and extensions
        run: >-
          xcodebuild -project native-ios/Logbook.xcodeproj
          -scheme Logbook
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
      - name: Run iPhone simulator tests
        run: >-
          xcodebuild -project native-ios/Logbook.xcodeproj
          -scheme Logbook
          -destination 'platform=iOS Simulator,name=iPhone 16'
          CODE_SIGNING_ALLOWED=NO test
      - name: Build Watch companion
        run: >-
          xcodebuild -project native-ios/Logbook.xcodeproj
          -scheme LogbookWatch
          -sdk watchsimulator
          -destination 'generic/platform=watchOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
