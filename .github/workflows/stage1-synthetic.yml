name: Logbook synthetic development checks
on:
  push:
    branches: [logbook-v2-upgrade]
    paths:
      - 'preview-widget/safety-core.js'
      - 'preview-widget/stage1-*.js'
      - 'stage1/**'
      - 'stage2/**'
      - 'stage3/**'
      - 'stage4/**'
      - 'stage5/**'
      - 'stage6/**'
      - 'preview/**'
      - 'tests/preview-*'
      - 'tests/stage6-*'
      - 'tests/stage5-*'
      - 'tests/stage4-*'
      - 'tests/stage3-*'
      - 'tests/stage2-*'
      - 'tests/stage1-*'
      - 'tests/support/**'
      - '.github/workflows/stage1-synthetic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run individual synthetic migration and conflict tests
        run: node --test --experimental-test-isolation=none tests/*.test.cjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --prefix "$RUNNER_TEMP/logbook-tools" playwright-core@1.64.1
      - name: Test actual Chromium persistence and concurrent tabs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          node stage1/build-dev.cjs
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/logbook-http.log" 2>&1 &
          for i in 1 2 3 4 5; do curl --fail --silent http://127.0.0.1:8765/stage1/harness.html > /dev/null && break; sleep 1; done
          NODE_PATH="$RUNNER_TEMP/logbook-tools/node_modules" node tests/stage1-browser.cjs
          NODE_PATH="$RUNNER_TEMP/logbook-tools/node_modules" node tests/stage1-legacy-browser.cjs
          NODE_PATH="$RUNNER_TEMP/logbook-tools/node_modules" node tests/stage2-browser.cjs
          NODE_PATH="$RUNNER_TEMP/logbook-tools/node_modules" node tests/stage2-editing-browser.cjs
          NODE_PATH="$RUNNER_TEMP/logbook-tools/node_modules" node tests/stage3-browser.cjs
          NODE_PATH="$RUNNER_TEMP/logbook-tools/node_modules" node tests/stage4-browser.cjs
          NODE_PATH="$RUNNER_TEMP/logbook-tools/node_modules" node tests/preview-browser.cjs
          NODE_PATH="$RUNNER_TEMP/logbook-tools/node_modules" node tests/stage6-browser.cjs
          NODE_PATH="$RUNNER_TEMP/logbook-tools/node_modules" node tests/stage6-update-browser.cjs
          NODE_PATH="$RUNNER_TEMP/logbook-tools/node_modules" node tests/stage5-browser.cjs
          NODE_PATH="$RUNNER_TEMP/logbook-tools/node_modules" node tests/stage5-visual-browser.cjs
      - name: Save synthetic browser previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-logbook-previews
          path: stage1/artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
  firestore-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install browser driver
        run: npm install --prefix "$RUNNER_TEMP/logbook-tools" playwright-core@1.64.1
      - name: Verify isolated Auth, Firestore, and integrated legacy UI
        env:
          NODE_PATH: ${{ runner.temp }}/logbook-tools/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          node stage1/build-dev.cjs
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/logbook-emulator-http.log" 2>&1 &
          for i in 1 2 3 4 5; do curl --fail --silent http://127.0.0.1:8765/stage1/harness.html > /dev/null && break; sleep 1; done
          npx --yes firebase-tools@14.27.0 emulators:exec --project demo-logbook-stage1 --config stage1/firebase.json --only firestore,auth "LOGBOOK_REQUIRE_EMULATORS=1 node --test --experimental-test-isolation=none tests/*firestore-emulator.test.cjs && node tests/stage1-legacy-emulator-browser.cjs && node tests/stage2-emulator-browser.cjs && node tests/stage3-emulator-browser.cjs && node tests/stage4-emulator-browser.cjs && node tests/stage5-emulator-browser.cjs"
