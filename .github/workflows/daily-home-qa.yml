name: Daily Home QA

on:
  push:
    branches: [qa/daily-home-workflow, codex/default-theme-gate1]
    paths:
      - 'native-ios/**'
      - '.github/workflows/daily-home-qa.yml'
  pull_request:
    branches: [qa/daily-home-workflow]
    paths:
      - 'native-ios/**'
      - '.github/workflows/daily-home-qa.yml'
  workflow_dispatch:

jobs:
  daily-home:
    strategy:
      fail-fast: false
      matrix:
        simulator:
          - { name: 'iPhone 16', slug: 'iphone-16', runner: 'macos-15' }
          - { name: 'iPhone SE (3rd generation)', slug: 'iphone-se-3', runner: 'macos-15' }
          - { name: 'iPhone 18 Pro', slug: 'iphone-18-pro', runner: 'macos-26' }
    runs-on: ${{ matrix.simulator.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check simulator availability
        id: simulator
        run: |
          DEVICE='${{ matrix.simulator.name }}'
          DEVICE_LIST="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(",".join(sorted({x["name"] for group in d["devices"].values() for x in group if x.get("isAvailable") and x["name"].startswith("iPhone")})))')"
          AVAILABLE="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; wanted=sys.argv[1]; d=json.load(sys.stdin); names=[x["name"] for group in d["devices"].values() for x in group if x.get("isAvailable")]; print("true" if wanted in names else "false")' "$DEVICE")"
          echo "available=$AVAILABLE" >> "$GITHUB_OUTPUT"
          if [ "$AVAILABLE" = "false" ]; then
            mkdir -p "native-ios/QA/artifacts/device-unavailable-${{ matrix.simulator.slug }}"
            printf 'Simulator **%s** is not installed on this GitHub runner (%s). No screenshot or test result was produced for this device. Available iPhone simulators: %s\n' "$DEVICE" '${{ matrix.simulator.runner }}' "$DEVICE_LIST" > "native-ios/QA/artifacts/device-unavailable-${{ matrix.simulator.slug }}/README.md"
            echo "Simulator not available: $DEVICE"
          fi

      - name: Run Daily Home QA
        if: steps.simulator.outputs.available == 'true'
        run: ./native-ios/QA/Scripts/run-daily-home-qa.sh '${{ matrix.simulator.name }}'

      - name: Upload simulator-specific screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-home-qa-${{ matrix.simulator.slug }}
          path: |
            native-ios/QA/artifacts/daily-home-*/screenshots/**
            native-ios/QA/artifacts/daily-home-*/summary.json
            native-ios/QA/artifacts/daily-home-*/xcodebuild.log
            native-ios/QA/artifacts/device-unavailable-*/README.md
            native-ios/QA/REPORT.md
          if-no-files-found: warn
          retention-days: 30
