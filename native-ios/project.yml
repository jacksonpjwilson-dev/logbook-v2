name: Logbook
options:
  bundleIdPrefix: com.example.logbook
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Logbook:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/Logbook
      - Shared/LogbookModels.swift
      - Shared/SharedStateFile.swift
      - Shared/WatchSnapshot.swift
      - Shared/WorkoutActivityAttributes.swift
    resources:
      - Resources/LogbookAssets.xcassets
      - Resources/exercise-catalog.json
      - Resources/food-catalog.json
    entitlements:
      path: Config/Logbook.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.logbook
    info:
      path: Config/Logbook-Info.plist
      properties:
        CFBundleDisplayName: Logbook
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.logbook
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: LogbookWidgets
      - target: LogbookWatch

  LogbookWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/LogbookWidgets
      - Shared/LogbookModels.swift
      - Shared/SharedStateFile.swift
      - Shared/WorkoutActivityAttributes.swift
    entitlements:
      path: Config/LogbookWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.logbook
    info:
      path: Config/LogbookWidgets-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.logbook.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

  LogbookWatch:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - Sources/LogbookWatch
      - Shared/LogbookModels.swift
      - Shared/WatchSnapshot.swift
    info:
      path: Config/LogbookWatch-Info.plist
      properties:
        WKWatchKitApp: true
        WKCompanionAppBundleIdentifier: com.example.logbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.logbook.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

  LogbookTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/LogbookTests
    dependencies:
      - target: Logbook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.logbook.tests
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

schemes:
  Logbook:
    build:
      targets:
        Logbook: all
        LogbookWidgets: all
        LogbookWatch: all
        LogbookTests: [test]
    test:
      config: Debug
      targets:
        - LogbookTests
  LogbookWatch:
    build:
      targets:
        LogbookWatch: all
