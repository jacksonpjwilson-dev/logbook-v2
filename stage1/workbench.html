<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Logbook — isolated storage workbench</title>
<style>body{max-width:850px;margin:auto;padding:1rem;font:16px system-ui;color:#172026;background:#f6f7f9}button,input{font:inherit;min-height:44px;padding:.4rem .7rem;margin:.2rem;max-width:100%;box-sizing:border-box}section{padding:1rem;background:white;margin:1rem 0;border-radius:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.sides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}h2{font-size:1.2rem}label{display:block}#status{font-weight:600}</style></head><body>
<h1>Logbook storage workbench</h1><p>Development only · synthetic data · local cloud simulation · no accounts, production data or external connections.</p>
<p id="status" role="status" aria-live="polite">Opening isolated IndexedDB…</p>
<section><h2>Local records</h2><form id="edit"><label>Record ID <input id="record-id" value="workout:synthetic-1" required></label><label>Fictional note <input id="record-value" value="Fictional unfinished workout" required></label><button>Save locally</button><button type="button" id="delete">Delete record</button></form><pre id="records"></pre></section>
<section><h2>Sync rehearsal</h2><button id="sync">Sync with local simulation</button><button id="offline" aria-pressed="false">Simulate offline</button><button id="conflict">Simulate competing edit</button><div id="conflicts"></div></section>
<section><h2>Backup and recovery</h2><button id="backup">Save synthetic backup</button><label>Restore mode <select id="restore-mode"><option value="merge">Merge backup entries; keep others</option><option value="replace">Replace current snapshot with backup</option></select></label><button id="preview">Preview restore</button><div id="restore-preview"></div><button id="restore" hidden>Confirm restore</button><button id="undo">Undo latest restore</button></section>
<script src="../preview-widget/safety-core.js"></script><script src="../preview-widget/stage1-store.js"></script><script src="../preview-widget/stage1-indexeddb.js"></script><script src="../preview-widget/stage1-sync-controller.js"></script><script src="workbench.js"></script></body></html>
